<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090c">
    <title>Music Player — YouTube Music</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===================== Aplikasi ===================== -->
    <main class="app">

        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Music Player</h1>
                    <p class="brand-project">By: ZeinthHub Project</p>
                    <p>Putar lagu &amp; album dari YouTube Music</p>
                </div>
                <a class="tg-link" href="https://t.me/Bleszh" target="_blank" rel="noopener"
                   title="Telegram Bleszh" aria-label="Buka Telegram Bleszh">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M21.94 4.6a1.6 1.6 0 0 0-1.65-.28L3.4 11.1a1.35 1.35 0 0 0 .07 2.53l3.6 1.13 1.4 4.46a1.05 1.05 0 0 0 1.72.44l2.03-1.9 3.62 2.66a1.35 1.35 0 0 0 2.11-.82l3.6-13.3a1.6 1.6 0 0 0-.61-1.7zM9.7 14.36l8.37-6.34c.2-.15.4.15.23.31l-6.6 6.17-.27 2.9-1.73-3.04z"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Panel pencarian -->
        <section class="search-panel">
            <div class="segmented" id="MethodSwitch" role="tablist" aria-label="Jenis pencarian">
                <button type="button" class="seg is-active" data-value="Album" role="tab" aria-selected="true">Album</button>
                <button type="button" class="seg" data-value="Song" role="tab" aria-selected="false">Lagu</button>
            </div>

            <!-- Select asli tetap ada supaya main.js tetap kompatibel -->
            <select id="Methods" class="visually-hidden" tabindex="-1" aria-hidden="true">
                <option value="Album">Album</option>
                <option value="Song">Song</option>
            </select>

            <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.2-3.2"></path>
                </svg>
                <input type="search" id="SearchBox" name="SearchBox" autocomplete="off" spellcheck="false"
                       placeholder="Cari lagu/album, atau tempel link YouTube…">
            </div>

            <button type="button" class="btn primary search-btn" id="SearchBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.2-3.2"></path>
                </svg>
                <span>Cari</span>
            </button>
        </section>

        <p class="status" id="Status" hidden></p>

        <!-- Hasil pencarian dirender di sini oleh main.js -->
        <section id="Content" class="results" aria-live="polite">
            <div class="empty" id="EmptyState">
                <span class="empty-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </span>
                <p>Belum ada apa-apa di sini</p>
                <span>Ketik judul album atau lagu, lalu tekan <kbd>Enter</kbd></span>
            </div>
        </section>

        <footer class="app-footer">
            <span>YouTube Music Player</span>
            <span class="dot">•</span>
            <span>Lagu diputar langsung, otomatis lanjut ke lagu berikutnya</span>
        </footer>
    </main>

    <!-- ===================== Player bar ===================== -->
    <div class="player" id="Player" hidden>
        <div class="player-cover">
            <img id="PlayerCover" alt="" src="">
        </div>

        <div class="player-info">
            <strong id="PlayerTitle">—</strong>
            <span id="PlayerArtist">—</span>
        </div>

        <div class="player-controls">
            <button type="button" class="pbtn" id="PrevBtn" title="Sebelumnya" aria-label="Sebelumnya">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M6 5h2.2v14H6zM19 5v14L9.5 12z"/>
                </svg>
            </button>
            <button type="button" class="pbtn main" id="PlayBtn" title="Putar / Jeda" aria-label="Putar atau jeda">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72L19 12z"/></svg>
            </button>
            <button type="button" class="pbtn" id="NextBtn" title="Berikutnya" aria-label="Berikutnya">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M15.8 5H18v14h-2.2zM5 5v14l9.5-7z"/>
                </svg>
            </button>
        </div>

        <div class="player-seek">
            <span id="CurTime">0:00</span>
            <input type="range" id="Seek" min="0" max="1000" step="1" value="0" aria-label="Posisi lagu">
            <span id="DurTime">0:00</span>
        </div>

        <div class="player-vol">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4z"></path>
                <path d="M16 9a4 4 0 0 1 0 6"></path>
            </svg>
            <input type="range" id="Vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
    </div>

    <!-- Elemen audio (sumber diisi oleh main.js) -->
    <audio id="Audio" preload="none"></audio>

    <!-- ===================== Now Playing (gaya YT Music) ===================== -->
    <div class="np" id="NowPlaying" hidden>
        <button type="button" class="np-close" id="NpClose" title="Tutup" aria-label="Tutup tampilan putar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
        </button>

        <div class="np-body">
            <div class="np-cover">
                <img id="NpCover" alt="Cover lagu" src="" referrerpolicy="no-referrer">
            </div>

            <div class="np-meta">
                <strong id="NpTitle">—</strong>
                <span id="NpArtist">—</span>
            </div>

            <div class="np-seek">
                <span id="NpCur">0:00</span>
                <input type="range" id="NpSeek" min="0" max="1000" step="1" value="0" aria-label="Posisi lagu">
                <span id="NpDur">0:00</span>
            </div>

            <div class="np-controls">
                <button type="button" class="pbtn" id="NpPrev" title="Sebelumnya" aria-label="Sebelumnya">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6zM19 5v14L9.5 12z"/></svg>
                </button>
                <button type="button" class="pbtn main" id="NpPlay" title="Putar / Jeda" aria-label="Putar atau jeda">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12z"/></svg>
                </button>
                <button type="button" class="pbtn" id="NpNext" title="Berikutnya" aria-label="Berikutnya">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2zM5 5v14l9.5-7z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ===================== Library ===================== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
            crossorigin="anonymous"></script>

    <!-- ===================== Logika aplikasi ===================== -->
    <script src="main.js?v=5"></script>
</body>
</html>
